<h4>Área da foto</h4>
<canvas id="fotoCanvas"></canvas>

<script>
let c=document.getElementById("fotoCanvas")
let ctx=c.getContext("2d")
let start=null

c.onmousedown=e=>start={x:e.offsetX,y:e.offsetY}
c.onmouseup=e=>{
 let box={
   x:start.x,
   y:start.y,
   w:e.offsetX-start.x,
   h:e.offsetY-start.y
 }
 fetch("/salvar_foto",{method:"POST",body:JSON.stringify(box)})
}
</script>
